<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fragments UI</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/water.css@2/out/water.css" />
    <script type="module" src="src/app.js"></script>
  </head>
  <body>
    <h1>Fragments UI</h1>

    <section>
      <nav>
        <button id="login">Login</button>
      </nav>
    </section>

    <section hidden id="user">
      <h2>Welcome <span class="username"></span>!</h2>

      <h3>Create a New Fragment</h3>
      <label for="fragmentType">Type</label>
      <select id="fragmentType">
        <option value="text/plain">text/plain</option>
        <option value="text/markdown">text/markdown</option>
        <option value="text/html">text/html</option>
        <option value="application/json">application/json</option>
        <option value="image/png">image/png</option>
        <option value="image/jpeg">image/jpeg</option>
        <option value="image/gif">image/gif</option>
        <option value="image/webp">image/webp</option>
      </select>

      <div id="contentArea">
        <label for="fragmentContent">Content</label>
        <textarea id="fragmentContent" rows="8" cols="60"></textarea>
      </div>

      <div id="fileArea" style="display:none;">
        <label for="fragmentFile">Select Image File</label>
        <input type="file" id="fragmentFile" accept="image/*" />
      </div>

      <button id="createFragment">Create Fragment</button>

      <div id="result"></div>

      <h3>Your Fragments</h3>
      <ul id="fragmentsList"></ul>
    </section>
  </body>
</html>
